# Site settings
title: ON4OSA
# Full <title> of the homepage.
tagline: ON4OSA – Radioamateurclub in Antwerpen | UBA-sectie OSA
# Appended to subpage titles so every page states what the club is (SEO).
title_suffix: ON4OSA – Radioamateurclub Antwerpen
# Meta description (kept under ~160 characters, Google's truncation limit).
description: >-
  ON4OSA is een radioamateurclub in Antwerpen en sectie OSA van de UBA.
  Ontdek onze bijeenkomsten, voordrachten, velddagen en activiteiten voor
  zendamateurs.
email: info@on4osa.be
baseurl: ""
# Canonical site URL (matches CNAME) — used for absolute URLs in sitemap.xml
# and the canonical/Open Graph tags from jekyll-seo-tag.
url: "https://on4osa.be"
# Locale used by jekyll-seo-tag (og:locale).
lang: nl_BE
author: ON4OSA

# Default social share image (og:image / twitter:image) for every page.
# Override per page with `image:` in its front matter.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/westhinder.jpg
  # og:locale per language (jekyll-seo-tag). The English content is written in
  # US English, hence en_US.
  - scope:
      path: nl
    values:
      locale: nl_BE
  - scope:
      path: en
    values:
      locale: en_US

# Optional jekyll-seo-tag fields — fill in if/when you have them:
# logo: /assets/img/logo.png          # used as the organisation logo in JSON-LD
# twitter:
#   username: ON4OSA
#   card: summary_large_image
# facebook:
#   publisher: https://www.facebook.com/...
# social:
#   name: ON4OSA
#   links:
#     - https://www.facebook.com/...
# google_site_verification: ...

# Build settings
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# ---------------------------------------------------------------------------
# Languages. Every page exists once per language under /<code>/.
# `default_lang` is what visitors get when localStorage has no `lang` value,
# and it is the hreflang="x-default" target. All UI strings live in
# _data/i18n.yml; see CLAUDE.md ("Meertaligheid").
# ---------------------------------------------------------------------------
languages:
  - nl
  - en
# The base language: the `_nl` fields in _data, the canonical URL and
# hreflang="x-default".
default_lang: nl
# Where the language gateway sends a visitor whose browser asks for neither
# Dutch nor English (a German speaker, say). Dutch readers still land on Dutch
# because their browser says so — see _layouts/redirect.html.
fallback_lang: en

# Silence Sass deprecation warnings coming from dependencies (e.g. the
# deprecated lighten()/darken() color functions used by older gems).
sass:
  quiet_deps: true
  style: compressed
  silence_deprecations:
    - color-functions
    - global-builtin
    - import

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - README.md
  - CLAUDE.md
