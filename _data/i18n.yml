  home:
    hero_eyebrow: Radio amateurs in Antwerp · ON4OSA
    hero_title: Welcome to OSA,<br>an Antwerp UBA section
    hero_lead: >-
      OSA is an amateur radio club in Antwerp and a local section of the UBA.<br>
      Our section grew out of the CW operators of the legendary Antwerp coastal
      station OSA in 1935, making it one of the oldest in the country. Today we
      bring together more than 50 members.
    hero_btn_meetings: When do we meet?
    hero_btn_about: About OSA
    meetings_kicker: Meetings
    meetings_title: When we meet
    meetings_sub: Everyone is welcome — licensed amateurs, shortwave listeners and anyone curious.
    meetings_map: View on the map →
    talks_kicker: Program
    talks_title: Talks
    talks_sub: Presentations on our club nights at Urania Public Observatory.
    talks_upcoming: Upcoming talks
    talks_past: Past talks
    talks_none: No talks are scheduled right now — check back soon.
    talks_poster_aria: View the poster at full size
    talks_poster_alt: Poster for the talk on HF propagation by ON4ALY on November 12, 2026
    on9bd_kicker: West-Hinder 3
    on9bd_title: Station ON9BD
    on9bd_text: >-
      Club station ON9BD is located on board the lightship West-Hinder 3.
      OSA members activate it on various occasions and it is equipped with
      antennas for both the HF and VHF bands.
    on9bd_more: Read more
    activations_kicker: On the air
    activations_title: Activations
    activations_sub: On the air, in the field and on board — all year round.
    activations:
      - title: Field days
        text: Twice a year we build a complete field station for the UBA CW and SSB field days.
        button: Our results
        slug: field-days
      - title: International Lighthouse Lightship Weekend
        text: Each August we put ON9BD on the air from the West-Hinder 3, alongside lighthouses and lightships worldwide.
        button: Visit the website
        url: https://illw.net/
      - title: Museum Ships Weekend
        text: Each June the West-Hinder 3 joins museum ships around the world on the air.
        button: Visit the website
        url: https://nj2bb.org/museum/
      - title: Special events
        text: Occasionally we activate with a special callsigns for commemorations, anniversaries and regional events.
        button: Coming soon
    news_kicker: Newsletter
    news_title: OSA News
    # Only set in this block: the newsletters themselves are Dutch-only, which
    # is worth flagging to English readers but is self-evident in Dutch.
    news_title_hint: (in Dutch)
    news_sub: Our club newsletters — click an edition to open the PDF.
    news_latest: Latest edition
    news_cover: Cover

