  home:
    hero_eyebrow: Radioamateurs in Antwerpen · ON4OSA
    hero_title: Welkom bij OSA,<br>een Antwerpse UBA sectie
    hero_lead: >-
      OSA is een radioamateurclub in Antwerpen en lokale sectie van de UBA.<br>
      Onze sectie ontstond in 1935 uit de CW-operatoren van het legendarische
      Antwerpse kuststation OSA en is daarmee een van de oudste van het land.
      Vandaag brengen we ruim 50 leden samen.
    hero_btn_meetings: Wanneer vergaderen we?
    hero_btn_about: Over OSA
    meetings_kicker: Bijeenkomsten
    meetings_title: Wij vergaderen
    meetings_sub: Iedereen is welkom — radioamateurs, luisteramateurs en geïnteresseerden.
    meetings_map: Bekijk op de kaart →
    talks_kicker: Programma
    talks_title: Voordrachten
    talks_sub: Lezingen op onze clubavonden in Volkssterrenwacht Urania.
    talks_upcoming: Komende voordrachten
    talks_past: Voorbije voordrachten
    talks_none: Momenteel geen geplande voordrachten — hou deze pagina in de gaten.
    talks_poster_aria: Bekijk de affiche op ware grootte
    talks_poster_alt: Affiche van de voordracht HF-propagatie door ON4ALY op 12 november 2026
    on9bd_kicker: West-Hinder 3
    on9bd_title: Station ON9BD
    on9bd_text: >-
      Aan boord van het lichtschip West-Hinder 3 bevindt zich het clubstation ON9BD.
      Dit station wordt door de leden van OSA bij verschillende gelegenheden geactiveerd
      en is uitgerust met antennes voor zowel de HF- als de VHF-banden.
    on9bd_more: Meer info
    activations_kicker: Op de band
    activations_title: Activaties
    activations_sub: Op de band, in het veld en aan boord — het jaar rond.
    # `button` is button label per item. `slug` -> internal pagina, `url` ->
    # externe site, neither -> button without link (placeholder).
    activations:
      - title: Velddagen
        text: Tweemaal per jaar bouwen we een volledig veld station op voor de UBA-velddagen CW en SSB.
        button: Bekijk resultaten
        slug: field-days
      - title: International Lighthouse Lightship Weekend
        text: In augustus activeren we ON9BD aan boord van de West-Hinder 3, samen met andere vuurtorens en lichtschepen wereldwijd.
        button: Naar de website
        url: https://illw.net/
      - title: Museum Ships Weekend
        text: In juni is de West-Hinder 3 als museumschip in de lucht, samen met historische schepen over de hele wereld.
        button: Naar de website
        url: https://nj2bb.org/museum/
      - title: Special events
        text: Occasioneel activeren we met een special callsign bij herdenkingen, jubilea en regionale evenementen.
        button: Binnenkort meer
