    gallery_aria: View %count% photos of %event%
    gallery_photos: photos
    gallery_of: Photos of

  on9bd:
    kicker: West-Hinder 3
    title: Station ON9BD
    p1: >-
      Club station ON9BD is located on board the lightship West-Hinder 3.
      OSA members activate it on various occasions and it is equipped with
      antennas for both the HF and VHF bands.
    p2_before: ON9BD is activated every year during the
    p2_link: International Lighthouse Lightship Weekend (ILLW)
    p2_after: >-
      , in which radio amateurs worldwide put lighthouses and lightships on the
      air. The event takes place on the third full weekend of August.
    p3_before: The station is also on the air during the
    p3_link: Museum Ships Weekend
    p3_after: >-
      . During that weekend in June, museum ships around the world activate
      their onboard station and radio amateurs try to contact as many of them
      as possible.
    p4_before: >-
      Would you like to operate from the club station yourself? Radio amateurs
      are very welcome on board — feel free to get in touch at
    img_alt: Lightship West-Hinder 3

  silent_key:
    kicker: In memoriam
    title: Silent Key
    sub: >-
      "Silent Key" is the term radio amateurs use to remember a fellow amateur
      who has passed away. On this page we keep alive the memory of the members
      of section OSA we have lost — their callsigns remain part of our club.
    empty: There are currently no entries on this page.

