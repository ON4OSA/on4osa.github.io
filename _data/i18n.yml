en:
  code: en
  locale: en_US
  label: English
  short: EN
  dir_name: en

  meta:
    tagline: ON4OSA – Amateur Radio Club in Antwerp | UBA section OSA
    title_suffix: ON4OSA – Amateur Radio Club Antwerp
    description: >-
      ON4OSA is an amateur radio club in Antwerp and section OSA of the UBA.
      Discover our meetings, talks, field days and activities for radio
      amateurs.

  nav:
    toggle: Open/close menu
    language: Choose language
    items:
      - title: Home
