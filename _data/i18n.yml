  on9bd:
    kicker: West-Hinder 3
    title: Station ON9BD
    p1: >-
      Aan boord van het lichtschip West-Hinder 3 bevindt zich het clubstation ON9BD.
      Dit station wordt door de leden van OSA bij verschillende gelegenheden geactiveerd
      en is uitgerust met antennes voor zowel de HF- als de VHF-banden.
    p2_before: ON9BD wordt jaarlijks geactiveerd tijdens het
    p2_link: International Lighthouse Lightship Weekend (ILLW)
    p2_after: >-
      , waarbij radioamateurs wereldwijd vuurtorens en lichtschepen activeren.
      Dit event vindt jaarlijks plaats tijdens het derde volle weekend van augustus.
    p3_before: Daarnaast is het station in de lucht tijdens het
    p3_link: Museum Ships Weekend
    p3_after: >-
      . Tijdens dit weekend in juni activeren museumschepen wereldwijd hun
      boordstation en kunnen radioamateurs proberen zo veel mogelijk
      museumschepen te contacteren.
    p4_before: >-
      Wil je zelf eens uitzenden vanuit het clubstation? Radioamateurs zijn
      van harte welkom aan boord, neem gerust contact op via
    img_alt: Lichtschip West-Hinder 3

  silent_key:
    kicker: In memoriam
    title: Silent Key
    sub: >-
      "Silent Key" is de term waarmee radioamateurs een collega gedenken die
      is overleden. Op deze pagina houden we de herinnering levend aan de
      leden van sectie OSA die ons zijn ontvallen — hun roepnaam blijft
      verbonden met onze club.
    empty: Er zijn momenteel geen vermeldingen op deze pagina.

