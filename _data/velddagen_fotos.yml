# Sfeerbeelden van de velddagen — gebruikt door de carousel op /velddagen/.
# Per foto:
#   file     bestandsnaam in /assets/img/velddagen/, zonder .jpg
#   caption  tekst in de grijze pil onderaan de foto
#   alt      optioneel; alternatieve tekst voor screenreaders. Zonder dit veld
#            wordt `caption` gebruikt.
# Nieuwste velddag bovenaan; binnen een velddag chronologisch.
#
# Foto's toevoegen: verklein tot max. 1600 px op de lange zijde en verwijder
# alle metadata, zodat ze bij de bestaande beelden aansluiten:
#   magick foto.jpg -auto-orient -resize '1600x1600>' -strip \
#     -interlace Plane -quality 85 assets/img/velddagen/velddag-...-N.jpg
